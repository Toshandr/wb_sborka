version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wms-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/wms?sslmode=disable"
      JWT_SECRET: "KDJLFKJDPOPDUIFPID(F)IPO)__D_FOD__DFDKCFDLFKJDLFKCNClkNJIDFJKLDFJiKLCmNJDKfhKLACNLKJHFLlMkHHGHJGyvnvfthHGffVghfhVHGthfHGVhftVHGf"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: